<!-- login.component.html -->
<div class="login-page">
  <div class="overlay"></div>

  <div class="login-container">
    <div class="login-box animate-fade">
      <div class="logo-section">
        <img src="assets/logo.png" alt="MyShop Logo" class="logo" />
        <h2>Welcome Back to <span>MyShop</span></h2>
        <p>Manage your sales, track your progress, and stay connected.</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Username / Email</mat-label>
          <input matInput formControlName="username" required />
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            required
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="togglePasswordVisibility()"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <button mat-raised-button color="primary" class="login-btn" type="submit" [disabled]="loginForm.invalid">
          Login
        </button>

        <div class="signup-text">
          <p>
           
          </p>
        </div>
      </form>

      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
    </div>
  </div>
</div>
